<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg" x1="55" y1="30" x2="450" y2="490" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1B2738"/>
      <stop offset="1" stop-color="#080D15"/>
    </linearGradient>
    <linearGradient id="frame" x1="95" y1="82" x2="430" y2="430" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset=".28" stop-color="#8CCBFF"/>
      <stop offset=".58" stop-color="#D8E6FF"/>
      <stop offset=".82" stop-color="#6DBBFF"/>
      <stop offset="1" stop-color="#E5EDFF"/>
    </linearGradient>
    <linearGradient id="node" x1="170" y1="120" x2="350" y2="390" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E9F2FF"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2.5" result="blur"/>
      <feOffset dy="2" result="offset"/>
      <feComposite in="offset" in2="SourceAlpha" operator="out" result="shadow"/>
      <feColorMatrix in="shadow" type="matrix" values="0 0 0 0 0.01 0 0 0 0 0.08 0 0 0 0 0.18 0 0 0 .75 0"/>
      <feBlend in="SourceGraphic"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="72" fill="url(#bg)"/>

  <rect x="38" y="38" width="436" height="436" rx="91" stroke="#73B9FF" stroke-width="12" opacity=".45" filter="url(#glow)"/>
  <rect x="42" y="42" width="428" height="428" rx="87" stroke="url(#frame)" stroke-width="7"/>
  <rect x="49" y="49" width="414" height="414" rx="80" stroke="#D9E9FF" stroke-opacity=".16" stroke-width="1.5"/>

  <g stroke="url(#node)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" filter="url(#shadow)">
    <path d="M198 149 L175 172 L149 197"/>
    <path d="M221 149 L245 173 L267 197"/>
    <path d="M290 197 L315 197 L340 172"/>
    <path d="M290 245 L267 268 L245 292"/>
    <path d="M245 316 L267 340"/>
    <path d="M221 340 L221 365"/>
  </g>

  <g stroke="url(#node)" stroke-width="9" stroke-linejoin="round" filter="url(#shadow)">
    <rect x="123" y="123" width="53" height="53" rx="10" fill="url(#node)" stroke="url(#node)"/>
    <rect x="194" y="123" width="53" height="53" rx="9" fill="url(#bg)"/>
    <rect x="265" y="123" width="53" height="53" rx="10" fill="url(#node)" stroke="url(#node)"/>
    <rect x="336" y="123" width="53" height="53" rx="9" fill="url(#bg)"/>

    <rect x="123" y="194" width="53" height="53" rx="9" fill="url(#bg)"/>
    <rect x="194" y="194" width="53" height="53" rx="10" fill="url(#node)" stroke="url(#node)"/>
    <rect x="265" y="194" width="53" height="53" rx="9" fill="url(#bg)"/>
    <rect x="336" y="194" width="53" height="53" rx="10" fill="url(#node)" stroke="url(#node)"/>

    <rect x="194" y="265" width="53" height="53" rx="9" fill="url(#bg)"/>
    <rect x="265" y="265" width="53" height="53" rx="10" fill="url(#node)" stroke="url(#node)"/>

    <rect x="194" y="336" width="53" height="53" rx="10" fill="url(#node)" stroke="url(#node)"/>
    <rect x="265" y="336" width="53" height="53" rx="9" fill="url(#bg)"/>
  </g>
</svg>
