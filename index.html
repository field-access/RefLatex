<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RefLatex — PureRef-style Markdown Canvas</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/marked@15.0.12/marked.min.js"></script>

<style>
:root{
 --canvas:#d9d6cf;--paper:#fffdf8;--ink:#272622;--muted:#77736b;
 --panel:#f7f5f0e8;--border:#c8c4bb;--accent:#5b57b7;
}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden}
body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:var(--canvas)}
#canvas{
 position:fixed;inset:0;overflow:hidden;touch-action:none;
 background-color:var(--canvas);
 background-image:radial-gradient(#77736b55 .7px,transparent .7px);
 background-size:24px 24px;
 cursor:default;
}
#world{position:absolute;left:0;top:0;width:1px;height:1px;transform-origin:0 0;will-change:transform}
#board{
 position:absolute;left:-1800px;top:-1100px;width:3600px;height:2200px;
 background:#e4e1da;border:1px solid #bbb7ae;border-radius:7px;
 box-shadow:0 20px 60px #00000015,0 0 0 1px #ffffff55;
 pointer-events:none;z-index:0;
 transition:left .16s ease,top .16s ease,width .16s ease,height .16s ease;
}
#board:after{
 content:"";position:absolute;inset:10px;border:1px solid #ffffff55;border-radius:5px
}
body.dark #board{background:#20201e;border-color:#494740}
.card{
 position:absolute;width:500px;min-width:300px;max-width:1200px;
 background:var(--paper);border:1px solid #cbc7be;border-radius:6px;
 box-shadow:0 9px 28px #00000018,0 2px 5px #0000000d;
 z-index:3;
}
.card.selected{outline:2px solid #5b57b744;outline-offset:3px}
.cardbar{
 height:26px;cursor:grab;position:relative;border-bottom:1px solid transparent;
}
.cardbar:hover{border-bottom-color:#e0ddd6}
.cardbody{
 padding:28px 42px 38px;
 overflow-wrap:anywhere;
 user-select:text;
}
.cardbody h1,.cardbody h2,.cardbody h3,.cardbody h4,.cardbody h5{
 font-family:Inter,ui-sans-serif,system-ui,sans-serif;letter-spacing:-.025em;line-height:1.2;
}
.cardbody h1{font-size:31px;margin:0 0 18px}
.cardbody h2{font-size:24px;margin:30px 0 12px}
.cardbody h3{font-size:19px;margin:25px 0 9px}
.cardbody p,.cardbody li{
 font:18px/1.78 Georgia,"Times New Roman",serif;
}
.cardbody p{margin:0 0 17px}
.cardbody ul,.cardbody ol{padding-left:28px}
.cardbody li{margin:5px 0}
.cardbody strong{font-weight:700}
.cardbody blockquote{
 margin:21px 0;padding:3px 0 3px 17px;border-left:3px solid #d0ccc4;color:#6e6a63
}
.cardbody code{
 font:14px/1.5 ui-monospace,SFMono-Regular,Consolas,monospace;
 background:#efede8;border-radius:4px;padding:2px 5px
}
.cardbody pre{
 margin:19px 0;padding:16px;overflow:auto;border-radius:7px;
 background:#242321;color:#f4f2ec;font:13px/1.6 ui-monospace,SFMono-Regular,Consolas,monospace
}
.cardbody pre code{background:none;padding:0;color:inherit}
.cardbody table{border-collapse:collapse;width:100%;font:14px/1.5 system-ui;margin:20px 0}
.cardbody th,.cardbody td{border:1px solid #d2cec6;padding:8px 10px}
.cardbody th{background:#f1efe9}
.cardbody hr{border:0;border-top:1px solid #ddd9d1;margin:28px 0}
.cardbody a{color:#514ca5;text-decoration:none}
.katex{font-size:1em}
.katex-display{margin:1.3em 0;padding:5px 0;overflow-x:auto}
.resize{
 position:absolute;top:30px;bottom:25px;width:12px;z-index:5;cursor:ew-resize
}
.resize.left{left:-6px}.resize.right{right:-6px}
.resize:after{
 content:"";position:absolute;left:50%;top:50%;width:3px;height:34px;
 transform:translate(-50%,-50%);border-radius:3px;background:transparent
}
.card:hover .resize:after,.card.selected .resize:after{background:#5b57b728}
.cardactions{
 position:absolute;right:7px;top:4px;display:none;gap:3px;z-index:8
}
.card.selected .cardactions{display:flex}
.cardactions button{
 border:0;background:transparent;width:26px;height:25px;border-radius:5px;color:#777;
}
.cardactions button:hover{background:#eeece6;color:#333}
.toolbar,.zoom{
 position:fixed;z-index:30;
 display:flex;align-items:center;gap:5px;
 padding:6px;
 background:color-mix(in srgb,var(--panel) 94%,transparent);
 border:1px solid #00000012;
 box-shadow:0 12px 36px #00000018;
 border-radius:15px;
 transition:opacity .28s ease,transform .28s ease,filter .2s ease;
}
.toolbar{
 left:14px;top:50%;transform:translateY(-50%);
 flex-direction:column;width:54px;
}
.toolbar .tool{
 position:relative;
 width:40px;height:40px;
 min-width:40px;
 padding:0;
 display:grid;place-items:center;
 border:0;border-radius:10px;
 background:transparent;
 color:#3c3a36;
 font-size:16px;
 line-height:1;
 cursor:pointer;
 transition:background .14s ease,color .14s ease,transform .12s ease;
}
.toolbar .tool:hover{background:#00000009}
.toolbar .tool:active{transform:scale(.92)}
.toolbar .tool.active{
 background:var(--accent);
 color:#fff;
 box-shadow:0 5px 15px #00000018;
}
.toolbar .tool[title]::after{
 content:attr(title);
 position:absolute;
 left:50px;top:50%;
 transform:translateY(-50%) translateX(-5px);
 opacity:0;
 pointer-events:none;
 white-space:nowrap;
 padding:7px 9px;
 border-radius:8px;
 background:#20201e;
 color:#fff;
 font:11px/1.2 Inter,system-ui,sans-serif;
 box-shadow:0 8px 22px #00000028;
 transition:opacity .12s,transform .12s;
}
@media (hover:hover) and (pointer:fine){
 .toolbar .tool[title]:hover::after{
  opacity:1;
  transform:translateY(-50%) translateX(0);
 }
}
.toolbar .divider{
 width:28px;height:1px;
 margin:3px auto;
 background:#d2cec6;
}
.zoom{
 right:14px;bottom:14px;
 border-radius:12px;
}
button.tool,.zoom button{
 border:0;background:transparent;border-radius:8px;
 height:31px;padding:0 10px;
 font-size:12px;color:#383631;cursor:pointer
}
button.tool:hover,.zoom button:hover{background:#ebe9e3}
button.tool.active{background:#e8e6ff;color:var(--accent)}
.primary{background:#292826!important;color:#fff!important}
.divider{width:1px;height:20px;background:#d0ccc4;margin:0 3px}
.zlabel{min-width:44px;text-align:center;font-size:11px;color:#77736b}

body.controls-hidden .toolbar{
 opacity:0;
 transform:translate(-18px,-50%);
 pointer-events:none;
}
body.controls-hidden .zoom{
 opacity:0;
 transform:translateY(12px);
 pointer-events:none;
}
body.controls-hidden .hint{
 opacity:0;
}
.hint{
 position:fixed;z-index:25;left:14px;bottom:14px;padding:7px 9px;border-radius:6px;
 background:var(--panel);border:1px solid #00000010;color:#77736b;font-size:10px;
 opacity:0;pointer-events:none;transition:opacity .2s ease
}
body.controls .hint{opacity:1;pointer-events:auto}
.empty{
 position:fixed;inset:0;display:grid;place-items:center;z-index:1;pointer-events:none;
 color:#827e76;text-align:center
}
.empty b{display:block;font-size:13px;color:#6d6962}.empty span{font-size:11px}
.editor{
 position:fixed;z-index:100;left:16px;top:64px;width:min(500px,calc(100vw - 32px));
 height:min(720px,calc(100vh - 80px));display:none;flex-direction:column;
 background:#faf9f6f5;border:1px solid #00000018;border-radius:10px;
 box-shadow:0 20px 60px #00000025;overflow:hidden;backdrop-filter:blur(15px)
}
.editor.open{display:flex}
.editorhead{padding:12px 14px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between}
.etitle{font-size:12px;font-weight:700}.esub{font-size:10px;color:#88837b;margin-top:2px}
#source{
 flex:1;resize:none;border:0;outline:0;padding:17px;background:#fffefa;color:#2b2926;
 font:13px/1.65 ui-monospace,SFMono-Regular,Consolas,monospace
}
.editorfoot{padding:8px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:6px}
.editorfoot button{border:0;border-radius:6px;padding:8px 13px;font-size:11px;cursor:pointer}
.cancel{background:#ebe9e3}.apply{background:#292826;color:#fff}
.context{
 position:fixed;z-index:200;display:none;width:180px;padding:4px;
 background:#faf9f6;border:1px solid #00000018;border-radius:7px;box-shadow:0 14px 35px #0003
}
.context.open{display:block}
.context button{display:block;width:100%;border:0;background:transparent;text-align:left;padding:8px;border-radius:5px;font-size:11px}
.context button:hover{background:#ebe9e3}
.edge{position:fixed;z-index:40;left:0;top:50%;transform:translateY(-50%);width:20px;height:74px;
 border-radius:0 9px 9px 0;background:var(--panel);border:1px solid #0001;display:none;place-items:center}
body.dark{
 --canvas:#171716;--paper:#242321;--ink:#e9e6df;--muted:#9d9990;
 --panel:#252421e8;--border:#47443e;
}
body.dark #canvas{background-color:#171716;background-image:radial-gradient(#aaa69d25 .7px,transparent .7px)}
body.dark #board{background:#20201e;border-color:#494740}
body.dark .card{border-color:#4a4740;box-shadow:0 12px 32px #0008}
body.dark .cardbody code{background:#36342f}
body.dark .cardbody th{background:#302e2a}
body.dark .cardbody th,body.dark .cardbody td{border-color:#4b4841}
body.dark .cardbody blockquote{border-color:#5b574f;color:#aaa59d}
body.dark button.tool,.dark .zoom button{color:#dedbd5}
body.dark button.tool:hover,body.dark .zoom button:hover{background:#37352f}
body.dark #source{background:#1f1e1b;color:#e9e6df}
body.dark .cancel{background:#383631}
body.dark .context{background:#292824;color:#eee}
body.dark .context button{color:#eee}
body.dark .context button:hover{background:#3a3832}
body.fullscreen .toolbar,body.fullscreen .zoom,body.fullscreen .hint{opacity:0;pointer-events:none}
body.fullscreen.controls .toolbar,body.fullscreen.controls .zoom,body.fullscreen.controls .hint{opacity:1;pointer-events:auto}
body.fullscreen .toolbar{transform:translate(-12px,-50%)}
body.fullscreen.controls .toolbar{transform:translateY(-50%)}
body.fullscreen .edge{display:grid}
body.fullscreen.controls .edge{display:none}
@media(max-width:700px){
 .toolbar{
  left:8px;top:50%;right:auto;
  transform:translateY(-50%);
  overflow:visible;
}
body.fullscreen.controls .toolbar{transform:translateY(-50%)}
 .hint{display:none}.card{max-width:calc(100vw - 30px)}
 .cardbody{padding:22px 25px 30px}.cardbody p,.cardbody li{font-size:17px}
}

.cardbody .katex-display{

.cardbody .katex{font-size:1.02em}
.cardbody .katex-display{

.cardbody .ref-math-block{

.card.keyboard-focus{
 outline:2px solid var(--accent);

</style>
</head>
<body>
<div id="canvas">
 <div id="world">
  <div id="board"></div>
 </div>
 <div class="empty" id="empty"><div><b>Paste Markdown + LaTeX here</b><span>A quiet PureRef-style reading board</span></div></div>
</div>

<div class="toolbar" id="toolbar">
 <button class="tool active" id="hand" title="Hand: Zoom / Scroll">✋</button>
 <button class="tool primary" id="new" title="New Markdown card">＋</button>
 <button class="tool" id="fit" title="Fit canvas">⌗</button>
 <button class="tool" id="center" title="Center canvas">◎</button>
 <button class="tool" id="arrange" title="Arrange cards">⊞</button>
 <span class="divider"></span>
 <button class="tool" id="theme" title="Toggle dark mode">☾</button>
 <span class="divider"></span>
 <button class="tool" id="saveCanvas" title="Save canvas (Ctrl/Cmd+S)">↓</button>
 <button class="tool" id="openCanvas" title="Open canvas (Ctrl/Cmd+O)">↑</button>
 <input id="canvasFile" type="file" accept=".json,application/json" hidden>
 <button class="tool" id="full" title="Fullscreen">⛶</button>
</div>

<div class="zoom">
 <button id="minus">−</button><span class="zlabel" id="zoomLabel">100%</span>
 <button id="plus">＋</button><button class="tool" id="reset">100%</button>
</div>

<div class="hint" id="hint">✋ Hand ON = trackpad/wheel zoom · Hand OFF = trackpad/mouse scroll pan · Drag notes · Double-click edit · Ctrl/Cmd+Enter paste · Ctrl/Cmd+S save · Ctrl/Cmd+O open</div>
<div class="edge" id="edge">☰</div>

<div class="editor" id="editor">
 <div class="editorhead"><div><div class="etitle">Markdown</div><div class="esub">AI response → readable knowledge card</div></div><button class="tool" id="close">×</button></div>
 <textarea id="source" spellcheck="false" placeholder="# Concept

Explain the idea here.

For $T(n)=2T(n/2)+n$,

$$T(n)=O(n\log n)$$"></textarea>
 <div class="editorfoot"><button class="cancel" id="cancel">Cancel</button><button class="apply" id="apply">Place note</button></div>
</div>

 <button id="edit">Edit</button><button id="duplicate">Duplicate</button>
 <button id="copy">Copy Markdown</button><button id="remove">Delete</button>
</div>

<script>
(() => {
"use strict";

const $=s=>document.querySelector(s);
const canvas=$("#canvas"),world=$("#world"),editor=$("#editor"),source=$("#source"),context=$("#context");

if(window.marked?.setOptions) marked.setOptions({gfm:true,breaks:true});

const state={
 x:innerWidth/2,y:innerHeight/2,scale:1,
 targetX:innerWidth/2,targetY:innerHeight/2,targetScale:1,
 notes:[],selected:null,nextId:1,
 hand:true,spacePan:false,controlsVisible:true,pan:null,drag:null,rightPan:null,resize:null,editId:null,
 undo:[],redo:[],historyLock:false,raf:0,saveTimer:0,hideTimer:0,
 board:{left:-1800,top:-1100,width:3600,height:2200,margin:120}
};

function showControls(){
  document.body.classList.remove("controls-hidden");
  state.controlsVisible=true;
  clearTimeout(state.hideTimer);
  state.hideTimer=setTimeout(()=>{
    if(!editor.classList.contains("open") && !context.classList.contains("open")){
      document.body.classList.add("controls-hidden");
      state.controlsVisible=false;
    }
  },3200);
}
function wakeControls(){
  showControls();
}
function safeMarkdown(md){
 let out;
 try{
   out=window.marked?marked.parse(md):`<p>${escapeHtml(md)}</p>`;
 }catch{out=`<p>${escapeHtml(md)}</p>`}
 try{if(window.DOMPurify)out=DOMPurify.sanitize(out)}catch{}
 return out;
}
function escapeHtml(s){
 return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function normalizeEscapedLatex(s){
  let text=String(s);

  /*
   * AI/chat exports sometimes escape LaTeX delimiters:
   *   \\( ... \\)  -> \( ... \)
   *   \\[ ... \\]  -> \[ ... \]
   *
   * They may also escape commands:
   *   \\frac -> \frac
   *   \\lambda -> \lambda
   *
   * Only collapse a DOUBLE backslash when it is clearly LaTeX syntax.
   * Genuine LaTeX line breaks `\\` are preserved.
   */
  text=text
    .replace(/\\\\(?=\(|\))/g,"\\")
    .replace(/\\\\(?=\[|\])/g,"\\");

  // Inside probable LaTeX regions, normalize doubled command slashes.
  // This deliberately excludes a bare `\\` so matrix/line-break syntax survives.
  text=text.replace(
    /(?:\\\([\s\S]*?\\\)|\\\[[\s\S]*?\\\]|\$\$[\s\S]*?\$\$)/g,
    region=>region.replace(/\\\\(?=[A-Za-z])/g,"\\")
  );

  // Also support common AI output where a whole math command was escaped
  // but delimiters are already correct, e.g. \(\\frac{a}{b}\).
  text=text.replace(
    /\\\(([\s\S]*?)\\\)/g,
    (_,body)=>`\\(${body.replace(/\\\\(?=[A-Za-z])/g,"\\")}\\)`
  );
  text=text.replace(
    /\\\[([\s\S]*?)\\\]/g,
    (_,body)=>`\\[${body.replace(/\\\\(?=[A-Za-z])/g,"\\")}\\]`
  );
  text=text.replace(
    /\$\$([\s\S]*?)\$\$/g,
    (_,body)=>`$$${body.replace(/\\\\(?=[A-Za-z])/g,"\\")}$$`
  );

  return text;
}

function normalizeBareMath(s){
  const atom=String.raw`(?:`+
    String.raw`[A-Za-z][A-Za-z0-9]*(?:_[A-Za-z0-9{}]+)?(?:\([^()\n]*\))?`+
    String.raw`|\[[A-Za-z0-9_,\s]+\]`+
    String.raw`|[⟨⟩α-ωΑ-ΩλμσΣπ∞√]`+
  String.raw`)`;

  const operator=String.raw`(?:=|≈|≃|≅|≥|≤|≠|∝|:=|→|←)`;

  const mathCue=/(?:\^|_[A-Za-z0-9{]|\\(?:frac|dfrac|tfrac|sqrt|sum|prod|log|ln|sin|cos|tan|lim|infty|alpha|beta|gamma|lambda|mu|sigma|pi)|[×÷±∑∫√∞≈≤≥≠∝]|[A-Za-z]\([^)\n]+\)|\[[A-Za-z0-9_,\s]+\])/;

  function symbols(expr){
    return expr
      .replace(/×/g,"\\times ")
      .replace(/÷/g,"\\div ")
      .replace(/±/g,"\\pm ")
      .replace(/≈/g,"\\approx ")
      .replace(/≃/g,"\\simeq ")
      .replace(/≅/g,"\\cong ")
      .replace(/≥/g,"\\ge ")
      .replace(/≤/g,"\\le ")
      .replace(/≠/g,"\\ne ")
      .replace(/∝/g,"\\propto ")
      .replace(/∞/g,"\\infty ")
      .replace(/√\s*\(([^()\n]+)\)/g,"\\sqrt{$1}")
      .replace(/Σ/g,"\\Sigma ")
      .replace(/∑/g,"\\sum ")
      .replace(/∫/g,"\\int ")
      .replace(/α/g,"\\alpha ")
      .replace(/β/g,"\\beta ")
      .replace(/γ/g,"\\gamma ")
      .replace(/δ/g,"\\delta ")
      .replace(/λ/g,"\\lambda ")
      .replace(/μ/g,"\\mu ")
      .replace(/σ/g,"\\sigma ")
      .replace(/π/g,"\\pi ")
      .replace(/⟨/g,"\\langle ")
      .replace(/⟩/g,"\\rangle ");
  }

  function transformLine(line){
    if(!line.trim())return line;

    // Exceptions: Markdown structure, URLs, code-ish lines and table rows.
    if(/^\s*(?:#{1,6}\s|>|```|~~~|\|)/.test(line))return line;
    if(/^\s*(?:https?:\/\/|www\.)/.test(line))return line;
    if(/^\s{4,}\S/.test(line))return line;

    const prefixMatch=/^(\s*(?:[-*+]\s+|\d+[.)]\s+))/.exec(line);
    const prefix=prefixMatch?prefixMatch[1]:"";
    const body=prefix?line.slice(prefix.length):line;

    const rx=new RegExp(`(${atom}\\s*${operator}\\s*)`,"g");
    let out="",pos=0,match;

    while((match=rx.exec(body))){
      const start=match.index;
      const before=body.slice(0,start);

      // Don't touch an expression already inside explicit math.
      const dollarCount=(before.match(/(?<!\\)\$/g)||[]).length;
      if(dollarCount%2===1)continue;

      let rest=body.slice(start+match[0].length);
      let depth=0,end=rest.length;

      for(let i=0;i<rest.length;i++){
        const c=rest[i];
        if(c==="("||c==="["||c==="{")depth++;
        else if(c===")"||c==="]"||c==="}")depth=Math.max(0,depth-1);

        if(depth===0){
          if(/[.!?]/.test(c)&&/\s/.test(rest[i+1]||"")){
            end=i;break;
          }
          if(i>5 && /^\s+(?:for|where|with|which|that|this|the|is|are|means|represents|denotes|and|or|but)\b/i.test(rest.slice(i))){
            end=i;break;
          }
        }
      }

      let expr=(match[0]+rest.slice(0,end)).trim();
      if(expr.length<4||expr.length>260||!mathCue.test(expr))continue;

      expr=expr.replace(/[,:;]\s*$/,"").trim();
      out+=body.slice(pos,start);
      out+=`\\(${symbols(expr)}\\)`;
      pos=start+expr.length;
      rx.lastIndex=pos;
    }

    return out+body.slice(pos);
  }

  return s.split("\n").map(transformLine).join("\n");
}

function looksLikeMathBlock(code){
  const s=String(code).trim();

  // A fenced block is treated as mathematical content when it contains
  // explicit LaTeX display/inline delimiters or several strong LaTeX cues.
  // Ordinary programming blocks remain untouched.
  const hasDelimiter =
    /(?:\\\\)?\\\[[\s\S]*?(?:\\\\)?\\\]/.test(s) ||
    /(?:\\\\)?\\\([\s\S]*?(?:\\\\)?\\\)/.test(s) ||
    /\$\$[\s\S]*?\$\$/.test(s);

  const latexCommands =
    /\\(?:frac|dfrac|tfrac|begin|end|text|mathbf|mathrm|operatorname|sum|prod|int|infty|alpha|beta|gamma|lambda|mu|sigma|pi|deg|quad|left|right|cdot|times|cases)\b/.test(s);

  const matrixCues =
    /\\begin\s*\{(?:cases|matrix|pmatrix|bmatrix|aligned|array)\}/.test(s);

  if(hasDelimiter && (latexCommands || matrixCues)) return true;

  // Also catch AI output where a complete equation was accidentally put
  // between triple backticks without explicit $ delimiters.
  const equationLines=s.split(/\n+/).filter(Boolean);
  const equationCount=equationLines.filter(line=>
    /(?:=|≈|≤|≥|≠|∝)/.test(line) &&
    /(?:\^|_|\\[A-Za-z]+|[A-Za-z]\([^)]*\)|[×÷∑∫√∞])/.test(line)
  ).length;

  return equationLines.length>0 &&
         equationCount/equationLines.length>=0.7 &&
         /\\[A-Za-z]+/.test(s);
}

function renderMathBlockSource(code){
  let s=normalizeEscapedLatex(String(code).trim());

  // If the whole accidental code block is a LaTeX display, use its source.
  // If it contains a mix of explanatory text and LaTeX, wrap the complete
  // block as display math only when it is clearly equation-oriented.
  if(!/(?:\$\$|\\\[|\\\(|\\\\\[|\\\\\()/.test(s)){
    s=`$$${s}$$`;
  }
  return s;
}

function render(md){
  let text=normalizeEscapedLatex(String(md));
  const blockCodes=[];
  const inlineCodes=[];
  const math=[];

  // Protect fenced code blocks first. Some AI responses accidentally fence
  // LaTeX equations; those are classified after extraction.
  text=text.replace(
    /(^|\n)([ \t]*)(```+|~~~+)([^\n]*)\n([\s\S]*?)(?:\n[ \t]*\3[ \t]*)(?=\n|$)/g,
    (whole,lead,indent,fence,info,code)=>{
      const id=blockCodes.length;
      const language=(info||"").trim().split(/\s+/)[0]||"";
      blockCodes.push({code,language,math:looksLikeMathBlock(code)});
      return `${lead}@@REFLATEX_BLOCK_${id}@@`;
    }
  );

  // Protect indented code blocks.
  text=text.replace(
    /(^|\n)((?:[ \t]{4}.*(?:\n|$))+)/g,
    (whole,lead,block)=>{
      const id=blockCodes.length;
      const code=block.replace(/^[ \t]{4}/gm,"").replace(/\n$/,"");
      blockCodes.push({code,language:"",math:looksLikeMathBlock(code)});
      return `${lead}@@REFLATEX_BLOCK_${id}@@`;
    }
  );

  // Protect inline code.
  text=text.replace(/`([^`\n]+)`/g,(whole,code)=>{
    const id=inlineCodes.length;
    inlineCodes.push(code);
    return `@@REFLATEX_INLINE_${id}@@`;
  });

  // Explicit LaTeX delimiters. Long/display forms first.
  const mathPatterns=[
    /\$\$[\s\S]*?\$\$/g,
    /\\\[[\s\S]*?\\\]/g,
    /\\\([\s\S]*?\\\)/g,
    /(?<!\$)\$(?!\$)(?=\S)(?:\\.|[^$\\\n])+(?<=\S)\$(?!\$)/g
  ];

  for(const rx of mathPatterns){
    text=text.replace(rx,match=>{
      const id=math.length;
      math.push(match);
      return `@@REFLATEX_MATH_${id}@@`;
    });
  }

  // Bare AI equations.
  text=normalizeBareMath(text);

  let out=safeMarkdown(text);

  // Restore fenced blocks. Math-like blocks become actual KaTeX display
  // instead of literal dark code blocks.
  blockCodes.forEach((item,i)=>{
    const token=`@@REFLATEX_BLOCK_${i}@@`;

    if(item.math){
      const mathSource=renderMathBlockSource(item.code);
      out=out.replace(
        `<p>${token}</p>`,
        `<div class="ref-math-block">${mathSource}</div>`
      );
      out=out.split(token).join(
        `<div class="ref-math-block">${mathSource}</div>`
      );
    }else{
      const escaped=escapeHtml(item.code);
      const lang=item.language
        ? ` class="language-${escapeHtml(item.language)}"`:"";
      const codeHtml=`<pre><code${lang}>${escaped}</code></pre>`;
      out=out.replace(`<p>${token}</p>`,codeHtml);
      out=out.split(token).join(codeHtml);
    }
  });

  inlineCodes.forEach((code,i)=>{
    out=out.split(`@@REFLATEX_INLINE_${i}@@`)
      .join(`<code>${escapeHtml(code)}</code>`);
  });

  math.forEach((value,i)=>{
    out=out.split(`@@REFLATEX_MATH_${i}@@`).join(value);
  });

  const box=document.createElement("div");
  box.innerHTML=out;

  try{
    if(window.renderMathInElement){
      renderMathInElement(box,{
        delimiters:[
          {left:"$$",right:"$$",display:true},
          {left:"\\[",right:"\\]",display:true},
          {left:"\\(",right:"\\)",display:false},
          {left:"$",right:"$",display:false}
        ],
        throwOnError:false,
        strict:"ignore",
        trust:false,
        ignoredTags:["script","noscript","style","textarea","pre","code"]
      });
    }
  }catch(err){
    console.warn("KaTeX rendering:",err);
  }

  return box.innerHTML;
}

function zoomPrecise(f,cx=innerWidth/2,cy=innerHeight/2){
 // Capture the exact world coordinate underneath the pointer before zoom.
 const wx=(cx-state.x)/state.scale;
 const wy=(cy-state.y)/state.scale;

 const ns=Math.max(.12,Math.min(4,state.scale*f));

 // Solve the camera position so the same world point remains exactly
 // underneath the pointer. No accumulated target offset.
 const nx=cx-wx*ns;
 const ny=cy-wy*ns;

 state.x=nx;
 state.y=ny;
 state.scale=ns;
 state.targetX=nx;
 state.targetY=ny;
 state.targetScale=ns;

 apply();
}

function updateGlass(){
 if(!state.notes.length){
  state.board={left:-1800,top:-1100,width:3600,height:2200,margin:120};
  board.style.left=state.board.left+"px";
  board.style.top=state.board.top+"px";
  board.style.width=state.board.width+"px";
  board.style.height=state.board.height+"px";
  return;
 }

 const pad=120;
 let left=Infinity,top=Infinity,right=-Infinity,bottom=-Infinity;

 state.notes.forEach(n=>{
  const w=n.el.offsetWidth;
  const h=n.el.offsetHeight;
  left=Math.min(left,n.x);
  top=Math.min(top,n.y);
  right=Math.max(right,n.x+w);
  bottom=Math.max(bottom,n.y+h);
 });

 // A minimum readable glass area prevents it becoming a tiny box.
 const minW=3600,minH=900;
 const contentW=right-left;
 const contentH=bottom-top;
 const width=Math.max(minW,contentW+pad*2);
 const height=Math.max(minH,contentH+pad*2);

 const cx=(left+right)/2;
 const cy=(top+bottom)/2;

 state.board.left=cx-width/2;
 state.board.top=cy-height/2;
 state.board.width=width;
 state.board.height=height;

 board.style.left=state.board.left+"px";
 board.style.top=state.board.top+"px";
 board.style.width=state.board.width+"px";
 board.style.height=state.board.height+"px";

function openCanvasFile(file){
 if(!file)return;

 const reader=new FileReader();

 reader.onload=()=>{
  try{
   const data=JSON.parse(reader.result);

   if(!data || !Array.isArray(data.notes)){
    throw new Error("Invalid RefLatex canvas file");
   }

   state.historyLock=true;
   state.notes.forEach(n=>n.el.remove());
   state.notes=[];
   state.selected=null;

   data.notes.forEach(n=>{
    if(typeof n.markdown!=="string")return;
    makeNote(
     n.markdown,
     Number.isFinite(n.x)?n.x:0,
     Number.isFinite(n.y)?n.y:0,
     Number.isFinite(n.width)?n.width:600,
     false,
     Number.isFinite(n.id)?n.id:null
    );
   });

   state.nextId=Number.isFinite(data.nextId)
    ? data.nextId
    : Math.max(0,...state.notes.map(n=>n.id||0))+1;

   if(data.camera){
    state.x=Number.isFinite(data.camera.x)?data.camera.x:innerWidth/2;
    state.y=Number.isFinite(data.camera.y)?data.camera.y:innerHeight/2;
    state.scale=Number.isFinite(data.camera.scale)?data.camera.scale:1;
   }else{
    state.x=innerWidth/2;
    state.y=innerHeight/2;
    state.scale=1;
   }

   state.undo=[];
   state.redo=[];
   state.historyLock=false;

   sync();
   apply();
   updateGlass();
   empty();
   save();

   $("#hint").textContent=`Opened ${file.name}`;
   setTimeout(()=>$("#hint").textContent="✋ Hand ON = trackpad/wheel zoom · Hand OFF = trackpad/mouse scroll pan · Drag notes · Double-click edit · Ctrl/Cmd+Enter paste · Ctrl/Cmd+S save · Ctrl/Cmd+O open",2200);

  }catch(err){
   state.historyLock=false;
   alert("Could not open this canvas file.\\n\\n"+err.message);
  }
 };

 reader.onerror=()=>alert("Could not read the selected canvas file.");
 reader.readAsText(file);
}

/*
 * Trackpad / wheel navigation
 * HAND ON  -> wheel/trackpad zoom, anchored to the pointer.
 * HAND OFF -> two-axis canvas scrolling/panning.
 *
 * Trackpads emit many small WheelEvents. Accumulate them per animation frame
 * and use the existing camera interpolator for smooth motion.
 */
let wheelFrame=0;
let panWheelX=0,panWheelY=0;
let zoomWheelDelta=0;
let wheelPointerX=0,wheelPointerY=0;
let wheelIsPinch=false;

function wheelUnitDelta(e){
 const unit=e.deltaMode===1?16:e.deltaMode===2?innerHeight:1;
 return {x:e.deltaX*unit,y:e.deltaY*unit};
}

function scheduleWheelFrame(){
 if(wheelFrame)return;
 wheelFrame=requestAnimationFrame(()=>{
  wheelFrame=0;

  const dx=panWheelX,dy=panWheelY;
  const zd=zoomWheelDelta;
  const pinch=wheelIsPinch;

  panWheelX=panWheelY=zoomWheelDelta=0;
  wheelIsPinch=false;

  if(pinch||state.hand){
   if(Math.abs(zd)>0.001){
    // Increased gain: normal trackpad pinch/wheel now reaches a useful
    // zoom range in roughly the same physical gesture as PureRef.
    const factor=Math.exp(-zd*0.0028);
    zoomPrecise(factor,wheelPointerX,wheelPointerY);
   }
  }else{
   state.targetX-=dx;
   state.targetY-=dy;
   animate();
  }
 });
}

canvas.addEventListener("wheel",e=>{
 e.preventDefault();

 const d=wheelUnitDelta(e);
 wheelPointerX=e.clientX;
 wheelPointerY=e.clientY;

 // Chrome/Edge precision touchpads expose two-finger pinch as ctrl+wheel.
 const pinch=e.ctrlKey&&e.deltaMode===0;

 if(pinch){
  wheelIsPinch=true;
  zoomWheelDelta+=d.y;
 }else if(state.hand){
  // Hand ON: wheel / two-finger movement = zoom.
  zoomWheelDelta+=d.y;
 }else{
  // Hand OFF: ordinary two-finger scrolling = true 2D canvas panning.
  let dx=d.x,dy=d.y;
  if(e.shiftKey&&Math.abs(dx)<Math.abs(dy)){
   dx+=dy;dy=0;
  }
  panWheelX+=dx;
  panWheelY+=dy;
 }

 scheduleWheelFrame();

 if(!state.notes.length){
  updateGlass();
  moveTo(innerWidth/2,innerHeight/2,Math.min(1,(innerWidth-100)/state.board.width,(innerHeight-100)/state.board.height));
  return
}
 const b=state.notes.map(n=>{const r=n.el.getBoundingClientRect();return{a:worldPoint(r.left,r.top),b:worldPoint(r.right,r.bottom)}});
 const minX=Math.min(...b.map(q=>q.a.x)),maxX=Math.max(...b.map(q=>q.b.x)),minY=Math.min(...b.map(q=>q.a.y)),maxY=Math.max(...b.map(q=>q.b.y));
 const w=Math.max(1,maxX-minX),h=Math.max(1,maxY-minY),p=100,s=Math.max(.18,Math.min(1.5,widthOnly?(innerWidth-2*p)/w:Math.min((innerWidth-2*p)/w,(innerHeight-2*p)/h)));
 moveTo(innerWidth/2-(minX+w/2)*s,widthOnly?state.targetY:innerHeight/2-(minY+h/2)*s,s)
}
function arrange(){
 if(!state.notes.length)return;
 history();

 // Wider PureRef-style packing: more cards visible at once.
 // Six columns fit comfortably inside the enlarged central workspace.
 const columns=6;
 const gapX=45;
 const gapY=55;
 const left=-3000;
 const cardWidth=500;
 const usableWidth=columns*cardWidth+(columns-1)*gapX;

 state.notes.forEach(n=>{
  n.el.style.width=cardWidth+"px";
  n.el.style.left="0px";
  n.el.style.top="0px";
 });

 // Force layout after Markdown/KaTeX rendering.
 state.notes.forEach(n=>void n.el.offsetHeight);

 state.notes.forEach((n,i)=>{
  const col=i%columns;
  const row=Math.floor(i/columns);

  // Each row has its own height. We calculate row heights first so a tall
  // card only affects the row containing it, never the whole arrangement.
 });

 const rows=Math.ceil(state.notes.length/columns);
 const rowHeights=Array(rows).fill(0);

 state.notes.forEach((n,i)=>{
  const row=Math.floor(i/columns);
  rowHeights[row]=Math.max(rowHeights[row],n.el.offsetHeight);
 });

 let rowTop=-900;

 for(let row=0;row<rows;row++){
  for(let col=0;col<columns;col++){
   const i=row*columns+col;
   if(i>=state.notes.length)break;

   const n=state.notes[i];
   n.x=-usableWidth/2+col*(cardWidth+gapX);
   n.y=rowTop;
   n.el.style.left=n.x+"px";
   n.el.style.top=n.y+"px";
  }

  rowTop+=rowHeights[row]+gapY;
 }

 requestAnimationFrame(()=>{
  updateGlass();
  fit(false);
  save();
 });
}
function toggleTheme(){document.body.classList.toggle("dark");localStorage.setItem("reflatex-theme",document.body.classList.contains("dark")?"dark":"light");$("#theme").textContent=document.body.classList.contains("dark")?"☀":"☾"}
function revealControls(){
 showControls();clearTimeout(state.hideTimer);
 state.hideTimer=setTimeout(()=>{if(!editor.classList.contains("open"))document.body.classList.remove("controls")},2200)
}
async function toggleFull(){
 try{
  if(document.fullscreenElement)await document.exitFullscreen();
  else await document.documentElement.requestFullscreen();
 }catch{}
 document.body.classList.toggle("fullscreen",!!document.fullscreenElement||!document.body.classList.contains("fullscreen"))
 revealControls()
}
document.addEventListener("mousemove",e=>{if(document.body.classList.contains("fullscreen")&&(e.clientY<80||e.clientX<25))revealControls()});
document.addEventListener("fullscreenchange",()=>document.body.classList.toggle("fullscreen",!!document.fullscreenElement));

$("#hand").onclick=()=>{
 state.hand=!state.hand;
 updateHandUI();
showControls();
}
$("#new").onclick=()=>{state.editId=null;source.value="";$("#apply").textContent="Place note";editor.classList.add("open");source.focus()}
$("#fit").onclick=()=>{fit(false);save()}
$("#center").onclick=()=>{moveTo(innerWidth/2,innerHeight/2,1);save()}
$("#arrange").onclick=arrange
$("#theme").onclick=toggleTheme
$("#saveCanvas").onclick=downloadCanvas
$("#openCanvas").onclick=()=>$("#canvasFile").click()
$("#canvasFile").addEventListener("change",e=>{
 const file=e.target.files?.[0];
 openCanvasFile(file);
 e.target.value="";
})
$("#full").onclick=toggleFull
$("#edge").onclick=revealControls
$("#minus").onclick=()=>zoom(.89);$("#plus").onclick=()=>zoom(1.12);$("#reset").onclick=()=>moveTo(innerWidth/2,innerHeight/2,1)
$("#close").onclick=closeEditor;$("#cancel").onclick=closeEditor;$("#apply").onclick=applyEditor
$("#edit").onclick=()=>state.selected&&editNote(state.selected)
$("#duplicate").onclick=duplicate
$("#copy").onclick=copyNote
$("#remove").onclick=()=>state.selected&&deleteNote(state.selected)
document.addEventListener("click",e=>{if(!context.contains(e.target))context.classList.remove("open")})
document.addEventListener("paste",e=>{
 if(document.activeElement===source)return;
 const md=e.clipboardData?.getData("text/plain");if(!md?.trim())return;
 e.preventDefault();const p=worldPoint(innerWidth/2,innerHeight/2),n=makeNote(md,p.x-300,p.y-150,600,true);select(n);save()
});

function focusSelected(){
  const n=state.selected;
  if(!n)return;
  state.notes.forEach(x=>x.el.classList.remove("keyboard-focus"));
  n.el.classList.add("keyboard-focus");

  // Keep the selected card centered without changing its zoom level.
  const r={
    x:n.x,
    y:n.y,
    w:n.el.offsetWidth,
    h:n.el.offsetHeight
  };

  const targetScale=Math.max(.35,Math.min(1.25,state.targetScale||state.scale));
  const cx=r.x+r.w/2;
  const cy=r.y+r.h/2;

  moveTo(
    innerWidth/2-cx*targetScale,
    innerHeight/2-cy*targetScale,
    targetScale
  );
}

function cycleSelected(direction){
  if(!state.notes.length)return;

  let index=state.notes.indexOf(state.selected);

  if(index<0){
    index=direction>0?0:state.notes.length-1;
  }else{
    index=(index+direction+state.notes.length)%state.notes.length;
  }

  select(state.notes[index]);
  focusSelected();
}

window.addEventListener("keydown",e=>{
 const mod=e.ctrlKey||e.metaKey;
 const editing=document.activeElement===source ||
   document.activeElement?.tagName==="INPUT" ||
   document.activeElement?.tagName==="TEXTAREA";

 showControls();

 /*
  * SPACE
  * - selected card -> focus it
  * - no selection -> temporary hand/pan mode
  */
 if(e.code==="Space"&&!editing){
   e.preventDefault();
   if(state.selected){
     focusSelected();
     state.spacePan=false;
   }else{
     state.spacePan=true;
     canvas.style.cursor="grab";
   }
   return;
 }

 if(editing){
   // Keep normal text-editor navigation untouched.
   if(e.key==="Escape"){
     e.preventDefault();
     closeEditor();
   }
   return;
 }

 /*
  * CARD NAVIGATION
  *
  * Arrow Left/Right:
  *   previous / next card
  *
  * PageUp/PageDown:
  *   previous / next card, PureRef-style quick browsing
  *
  * Home/End:
  *   first / last card
  *
  * Ctrl + PageUp/PageDown:
  *   previous / next card as an explicit Windows-style
  *   document-navigation shortcut.
  */
 if(e.key==="PageUp"){
   e.preventDefault();
   cycleSelected(-1);
   return;
 }
 if(e.key==="PageDown"){
   e.preventDefault();
   cycleSelected(1);
   return;
 }
 if(e.key==="ArrowRight"&&!mod){
   e.preventDefault();
   cycleSelected(1);
   return;
 }
 if(e.key==="ArrowLeft"&&!mod){
   e.preventDefault();
   cycleSelected(-1);
   return;
 }
 if(e.key==="ArrowDown"&&!mod){
   e.preventDefault();
   cycleSelected(1);
   return;
 }
 if(e.key==="ArrowUp"&&!mod){
   e.preventDefault();
   cycleSelected(-1);
   return;
 }

 if(e.key==="Home"){
   e.preventDefault();
   if(state.notes.length){
     select(state.notes[0]);
     focusSelected();
   }else{
     fit();
   }
   return;
 }
 if(e.key==="End"){
   e.preventDefault();
   if(state.notes.length){
     select(state.notes[state.notes.length-1]);
     focusSelected();
   }else{
     fit();
   }
   return;
 }

 /*
  * VIEWPORT NAVIGATION
  * Ctrl+Arrow = move the canvas without changing selection.
  */
 if(mod&&e.key==="ArrowLeft"){
   e.preventDefault();
   state.targetX+=innerWidth*.72;
   animate();
   return;
 }
 if(mod&&e.key==="ArrowRight"){
   e.preventDefault();
   state.targetX-=innerWidth*.72;
   animate();
   return;
 }
 if(mod&&e.key==="ArrowUp"){
   e.preventDefault();
   state.targetY+=innerHeight*.72;
   animate();
   return;
 }
 if(mod&&e.key==="ArrowDown"){
   e.preventDefault();
   state.targetY-=innerHeight*.72;
   animate();
   return;
 }

 /* Canvas/file/edit shortcuts */
 if(mod&&e.key.toLowerCase()==="s"){
   e.preventDefault();
   downloadCanvas();
   return;
 }
 if(mod&&e.key.toLowerCase()==="o"){
   e.preventDefault();
   $("#canvasFile").click();
   return;
 }
 if(mod&&e.key==="Enter"){
   e.preventDefault();
   quickPaste();
   return;
 }
 if(mod&&e.key.toLowerCase()==="z"){
   e.preventDefault();
   e.shiftKey?redo():undo();
   return;
 }
 if(mod&&e.key.toLowerCase()==="y"){
   e.preventDefault();
   redo();
   return;
 }
 if(mod&&e.key.toLowerCase()==="d"){
   e.preventDefault();
   duplicate();
   return;
 }
 if(mod&&e.shiftKey&&e.key.toLowerCase()==="f"){
   e.preventDefault();
   toggleFull();
   return;
 }

 if(e.key==="Delete"&&state.selected){
   e.preventDefault();
   deleteNote(state.selected);
   return;
 }

 if(e.key==="Escape"){
   closeEditor();
   context.classList.remove("open");
   state.notes.forEach(n=>n.el.classList.remove("keyboard-focus"));
   return;
 }

 if(e.key.toLowerCase()==="h"){
   e.preventDefault();
   $("#hand").click();
   return;
 }

 if(e.key.toLowerCase()==="n"){
   e.preventDefault();
   $("#new").click();
   return;
 }
});
function load(){
 try{
  const d=JSON.parse(localStorage.getItem("reflatex")||"null");
  if(d){
   state.x=d.x??innerWidth/2;state.y=d.y??innerHeight/2;state.scale=d.scale??1;state.nextId=d.nextId??1;
   (d.notes||[]).forEach(n=>{if(typeof n.md==="string")makeNote(n.md,n.x||0,n.y||0,n.w||600,false,n.id)})
  }
 }catch{}
 const dark=localStorage.getItem("reflatex-theme")==="dark";
 if(dark){document.body.classList.add("dark");$("#theme").textContent="☀"}
 state.hand=true;$("#hand").classList.add("active");canvas.style.cursor="grab";
 sync();apply();updateGlass();empty()
}
window.addEventListener("resize",()=>{updateGlass();apply()});
window.addEventListener("keyup",e=>{
 if(e.code==="Space"){
  state.spacePan=false;
  canvas.style.cursor=state.hand?"grab":"default";
 }
});
load();
})();
</script>
