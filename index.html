<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RefLatex — PureRef-style Markdown Canvas</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/marked@15.0.12/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/contrib/auto-render.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
<script src="https://cdn.jsdelivr.net/npm/markmap-lib@0.18.12"></script>
<script src="https://cdn.jsdelivr.net/npm/markmap-view@0.18.12"></script>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="canvas">
 <div id="world">
 </div>
 <div class="empty" id="empty"><div><b>Paste Markdown + LaTeX here</b><span>A quiet PureRef-style reading board</span></div></div>
</div>

<div class="toolbar" id="toolbar">
 <button class="tool active" id="hand" title="Hand: Zoom / Scroll (H)">✋</button>
 <button class="tool primary" id="new" title="New Markdown card (N)">＋</button>
 <button class="tool" id="fit" title="Fit canvas (F)">⌗</button>
 <button class="tool" id="center" title="Center canvas (C)">◎</button>
 <button class="tool" id="arrange" title="Arrange cards (A)">⊞</button>
 <div class="background-picker">
  <button class="tool background-select" id="background" title="Background (B)" aria-label="Background" aria-expanded="false">◌</button>
  <div class="background-menu" id="backgroundMenu" role="menu">
   <button type="button" data-background-choice="dots" role="menuitem"><svg viewBox="0 0 32 22" aria-hidden="true"><rect width="32" height="22" fill="#d9d6cf"/><path d="M5 5h.1M16 5h.1M27 5h.1M5 16h.1M16 16h.1M27 16h.1" stroke="#77736b" stroke-width="2" stroke-linecap="round"/></svg><span>Dots</span></button>
   <button type="button" data-background-choice="sun" role="menuitem"><svg viewBox="0 0 32 22" aria-hidden="true"><rect width="32" height="22" fill="#d9d6cf"/><circle cx="24" cy="7" r="4" fill="#edbe62"/><path d="M24 1v-2M24 16v-2M18 7h-2M30 7h-2M20 3l-2-2M28 3l2-2" stroke="#c79239" stroke-width="1"/></svg><span>Sun</span></button>
  </div>
 </div>
 <span class="divider"></span>
 <button class="tool" id="theme" title="Toggle dark mode (T)">☾</button>
 <span class="divider"></span>
 <button class="tool" id="saveCanvas" title="Save canvas (Ctrl/Cmd+S)">↓</button>
 <button class="tool" id="openCanvas" title="Open canvas (Ctrl/Cmd+O)">↑</button>
 <input id="canvasFile" type="file" accept=".json,application/json" hidden>
 <button class="tool" id="full" title="Fullscreen (Ctrl/Cmd+Shift+F)">⛶</button>
</div>

<div class="zoom">
 <button id="minus" title="Zoom out (- or [)">−</button><span class="zlabel" id="zoomLabel">100%</span>
 <button id="plus" title="Zoom in (+ or ])">＋</button><button class="tool" id="reset" title="Reset zoom (0)">100%</button>
</div>

<div class="hint" id="hint">✋ Hand ON = trackpad/wheel zoom · Hand OFF = trackpad/mouse scroll pan · M new map · E edit · Shift+M open map · Shift+L layout · Esc close</div>
<div class="edge" id="edge">☰</div>

<div class="editor" id="editor">
 <div class="editorhead"><div><div class="etitle">Markdown source</div><div class="esub">Use the same source as a readable card or a Markmap</div></div><button class="tool" id="close" title="Close editor (Esc)">×</button></div>
 <textarea id="source" spellcheck="false" placeholder="# Concept

Explain the idea here.

For $T(n)=2T(n/2)+n$,

$$T(n)=O(n\log n)$$"></textarea>
 <div class="map-options" id="mapOptions">
  <label>Layout <select id="mapLayout"><option value="mindmap">Mindmap</option><option value="tree">Tree</option><option value="logicRight">Logic right</option><option value="logicLeft">Logic left</option></select></label>
  <label>Color <select id="mapColor"><option value="default">Default</option><option value="purple">Purple</option><option value="warm">Warm</option></select></label>
 </div>
 <div class="editorfoot"><button class="cancel" id="cancel">Cancel</button><button class="apply" id="applyCard">Place card</button><button class="apply map-apply" id="applyMap">Place map</button></div>
</div>

<div class="context" id="context">
 <button id="edit">Edit</button><button id="duplicate">Duplicate</button>
 <button id="copy">Copy Markdown</button><button id="remove">Delete</button>
</div>

<script src="app.js" defer></script>
</body>
</html>
