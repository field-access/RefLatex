<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RefLatex — PureRef-style Markdown Canvas</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/marked@15.0.12/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/contrib/auto-render.min.js"></script>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="canvas">
 <div id="world">
  <div id="board"></div>
 </div>
 <div class="empty" id="empty"><div><b>Paste Markdown + LaTeX here</b><span>A quiet PureRef-style reading board</span></div></div>
</div>

<div class="toolbar" id="toolbar">
 <button class="tool active" id="hand" title="Hand: Zoom / Scroll">✋</button>
 <button class="tool primary" id="new" title="New Markdown card">＋</button>
 <button class="tool" id="fit" title="Fit canvas">⌗</button>
 <button class="tool" id="center" title="Center canvas">◎</button>
 <button class="tool" id="arrange" title="Arrange cards">⊞</button>
 <span class="divider"></span>
 <button class="tool" id="theme" title="Toggle dark mode">☾</button>
 <span class="divider"></span>
 <button class="tool" id="saveCanvas" title="Save canvas (Ctrl/Cmd+S)">↓</button>
 <button class="tool" id="openCanvas" title="Open canvas (Ctrl/Cmd+O)">↑</button>
 <input id="canvasFile" type="file" accept=".json,application/json" hidden>
 <button class="tool" id="full" title="Fullscreen">⛶</button>
</div>

<div class="zoom">
 <button id="minus">−</button><span class="zlabel" id="zoomLabel">100%</span>
 <button id="plus">＋</button><button class="tool" id="reset">100%</button>
</div>

<div class="hint" id="hint">✋ Hand ON = trackpad/wheel zoom · Hand OFF = trackpad/mouse scroll pan · Drag notes · Double-click edit · Ctrl/Cmd+Enter paste · Ctrl/Cmd+S save · Ctrl/Cmd+O open</div>
<div class="edge" id="edge">☰</div>

<div class="editor" id="editor">
 <div class="editorhead"><div><div class="etitle">Markdown</div><div class="esub">AI response → readable knowledge card</div></div><button class="tool" id="close">×</button></div>
 <textarea id="source" spellcheck="false" placeholder="# Concept

Explain the idea here.

For $T(n)=2T(n/2)+n$,

$$T(n)=O(n\log n)$$"></textarea>
 <div class="editorfoot"><button class="cancel" id="cancel">Cancel</button><button class="apply" id="apply">Place note</button></div>
</div>

<div class="context" id="context">
 <button id="edit">Edit</button><button id="duplicate">Duplicate</button>
 <button id="copy">Copy Markdown</button><button id="remove">Delete</button>
</div>

<script src="app.js" defer></script>
</body>
</html>
